<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>audaxtech-workflow: how one change is made, checked and added to the project</title>
  <desc>A change starts as a written task on a task board. Claude works through eight steps: get ready, start, build and test, a person tries it, share for checking, quality check, a person decides, finish. Two steps need a person (trying it, and deciding). A safety net of automatic guards runs the whole time.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <g id="person"><circle r="19" fill="#f59e0b" stroke="#0f172a" stroke-width="2.5"/><circle cx="0" cy="-5" r="5.5" fill="#0f172a"/><path d="M-10 11a10 10 0 0 1 20 0z" fill="#0f172a"/></g>
    <g id="shield"><circle r="19" fill="#ef4444" stroke="#0f172a" stroke-width="2.5"/><path d="M0-11L10-7V2C10 9 4 12 0 14C-4 12-10 9-10 2V-7Z" fill="#fff"/></g>
    <g id="check"><circle r="19" fill="#4ade80" stroke="#0f172a" stroke-width="2.5"/><path d="M-9 0L-3 7L9-7" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <style>
      .bg{fill:#0f172a}
      .t{font-size:14px;fill:#f1f5f9}
      .s{font-size:14px;fill:#cbd5e1}
      .h{font-size:17px;font-weight:700;fill:#f8fafc}
      .sub{font-size:16px;fill:#cbd5e1}
      .title{font-size:28px;font-weight:700;fill:#f8fafc}
      .lane{font-size:13px;font-weight:700;letter-spacing:.07em;fill:#94a3b8}
      .leg{font-size:17px;font-weight:700;fill:#f8fafc}
      .col{fill:#334155}
      .step{fill:#1e293b;stroke:#64748b;stroke-width:1.5}
      .gate{fill:#422006;stroke:#f59e0b;stroke-width:2}
      .guard{fill:#450a0a;stroke:#f87171;stroke-width:1.5}
      .done{fill:#052e16;stroke:#4ade80;stroke-width:2}
      .ln{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#a)}
      .dash{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect class="bg" width="1200" height="970"/>

  <text class="title" x="40" y="52">How one change is made, checked and added to the project</text>
  <text class="sub" x="40" y="82">Conversations and ideas become written tasks. Nothing becomes part of the finished project until automatic tests pass and a person approves.</text>

  <!-- Legend -->
  <use href="#person" x="60" y="124"/><text class="leg" x="88" y="130">A person decides</text>
  <use href="#shield" x="270" y="124"/><text class="leg" x="298" y="130">Automatic safety guard</text>
  <use href="#check" x="580" y="124"/><text class="leg" x="608" y="130">Finished</text>

  <!-- Board -->
  <text class="lane" x="40" y="178">THE TASK BOARD  (where each task shows how far along it is)</text>
  <g>
    <rect class="col" x="40"  y="190" width="200" height="44" rx="8"/><text class="h" x="140" y="219" text-anchor="middle">Backlog</text>
    <rect class="col" x="270" y="190" width="200" height="44" rx="8"/><text class="h" x="370" y="219" text-anchor="middle">Ready</text>
    <rect class="col" x="500" y="190" width="200" height="44" rx="8"/><text class="h" x="600" y="219" text-anchor="middle">In Progress</text>
    <rect class="col" x="730" y="190" width="200" height="44" rx="8"/><text class="h" x="830" y="219" text-anchor="middle">In Review</text>
    <rect class="col" x="960" y="190" width="200" height="44" rx="8"/><text class="h" x="1060" y="219" text-anchor="middle">Done</text>
    <path class="ln" d="M242 212H268"/><path class="ln" d="M472 212H498"/><path class="ln" d="M702 212H728"/><path class="ln" d="M932 212H958"/>
  </g>
  <text class="s" x="140" y="258" text-anchor="middle">Ideas waiting their turn</text>
  <text class="s" x="370" y="258" text-anchor="middle">Clear enough to start</text>
  <text class="s" x="600" y="258" text-anchor="middle">Someone is working on it</text>
  <text class="s" x="830" y="258" text-anchor="middle">Being checked</text>
  <text class="s" x="1060" y="258" text-anchor="middle">Added to the main version</text>

  <!-- Steps -->
  <text class="lane" x="40" y="312">THE STEPS  (what happens when a person says "work on task #N")</text>

  <!-- row 1 -->
  <rect class="step" x="40" y="326" width="250" height="128" rx="10"/>
  <text class="h" x="56" y="354">1  Get ready</text>
  <text class="s" x="56" y="378">Check where things stand,</text><text class="s" x="56" y="398">read the task and the</text><text class="s" x="56" y="418">project's rules, state a plan</text>

  <rect class="step" x="330" y="326" width="250" height="128" rx="10"/>
  <text class="h" x="346" y="354">2  Start</text>
  <text class="s" x="346" y="378">Mark the task In Progress and</text><text class="s" x="346" y="398">make a separate working copy</text><text class="s" x="346" y="418">so nothing existing is at risk</text>

  <rect class="step" x="620" y="326" width="250" height="128" rx="10"/>
  <text class="h" x="636" y="354">3  Build and test</text>
  <text class="s" x="636" y="378">Make the change and write</text><text class="s" x="636" y="398">tests that prove it works.</text><text class="s" x="636" y="418">Tricky logic gets a second,</text><text class="s" x="636" y="438">independent test review.</text>

  <rect class="gate" x="910" y="326" width="250" height="128" rx="10"/>
  <text class="h" x="926" y="354">4  A person tries it</text>
  <text class="s" x="926" y="378">A person uses it hands-on,</text><text class="s" x="926" y="398">on their own computer. Nothing</text><text class="s" x="926" y="418">is shared until they approve.</text>

  <path class="ln" d="M292 390H328"/><path class="ln" d="M582 390H618"/><path class="ln" d="M872 390H908"/>
  <path class="ln" d="M1035 456V498"/>

  <!-- row 2 -->
  <rect class="step" x="910" y="500" width="250" height="128" rx="10"/>
  <text class="h" x="926" y="528">5  Share for checking</text>
  <text class="s" x="926" y="552">Submit the change for review</text><text class="s" x="926" y="572">(a "pull request"), linked to</text><text class="s" x="926" y="592">the task. Automatic tests run.</text>

  <rect class="step" x="620" y="500" width="250" height="128" rx="10"/>
  <text class="h" x="636" y="528">6  Quality check</text>
  <text class="s" x="636" y="552">Six checks in order: it runs;</text><text class="s" x="636" y="572">tests mean something; fresh</text><text class="s" x="636" y="592">reviewer reads it; tried for</text><text class="s" x="636" y="612">real; docs and notes current.</text>

  <rect class="gate" x="330" y="500" width="250" height="128" rx="10"/>
  <text class="h" x="346" y="528">7  A person decides</text>
  <text class="s" x="346" y="552">Add it to the project?</text><text class="s" x="346" y="572">Yes: finish (step 8).</text><text class="s" x="346" y="592">Not yet: back to step 3.</text><text class="s" x="346" y="612">No: set it aside.</text>

  <rect class="done" x="40" y="500" width="250" height="128" rx="10"/>
  <text class="h" x="56" y="528">8  Finish</text>
  <text class="s" x="56" y="552">Add the change to the main</text><text class="s" x="56" y="572">version, tidy up the working</text><text class="s" x="56" y="592">copy, mark the task Done.</text>

  <path class="ln" d="M908 564H872"/><path class="ln" d="M618 564H582"/><path class="ln" d="M328 564H292"/>

  <!-- loop back -->
  <path class="dash" d="M745 498V458" marker-end="url(#a)"/>
  <text class="s" x="760" y="484">problems found: fix, then re-check</text>
  <path class="dash" d="M560 498V476H690V458" marker-end="url(#a)"/>
  <text class="s" x="336" y="484">Not yet: changes needed</text>

  <!-- Safety net -->
  <text class="lane" x="40" y="672">SAFETY NET  (always on, no one has to remember)</text>
  <rect class="guard" x="40" y="686" width="350" height="128" rx="10"/>
  <text class="h" x="56" y="714">Merge lock</text>
  <text class="s" x="56" y="738">Blocks adding a change to the main</text><text class="s" x="56" y="758">version while any automatic test is</text><text class="s" x="56" y="778">failing. Works inside Claude only,</text><text class="s" x="56" y="798">not on the GitHub website.</text>

  <rect class="guard" x="420" y="686" width="350" height="128" rx="10"/>
  <text class="h" x="436" y="714">Wrong-project guard</text>
  <text class="s" x="436" y="738">Blocks changes that would land in</text><text class="s" x="436" y="758">the wrong project, for example</text><text class="s" x="436" y="778">when Claude is left pointing at a</text><text class="s" x="436" y="798">different folder.</text>

  <rect class="step" x="800" y="686" width="360" height="128" rx="10"/>
  <text class="h" x="816" y="714">Review helpers  (used in step 6)</text>
  <text class="s" x="816" y="738">One lists what should be tested,</text><text class="s" x="816" y="758">from the written goal alone. The</text><text class="s" x="816" y="778">other tries to slip in a broken</text><text class="s" x="816" y="798">version the tests would miss.</text>

  <path class="dash" d="M165 686V630"/>
  <path class="dash" d="M900 686V656H745V630"/>

  <!-- Badges -->
  <use href="#person" x="1160" y="326"/>
  <use href="#person" x="580" y="500"/>
  <use href="#check" x="290" y="500"/>
  <use href="#shield" x="390" y="686"/>
  <use href="#shield" x="770" y="686"/>

  <!-- Setup strip -->
  <rect x="40" y="846" width="1120" height="94" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="h" x="56" y="874">Once per project: setup</text>
  <text class="s" x="56" y="898">Sets up the project rules, a decision log, task and review templates, automatic tests, the task board, and the switch</text>
  <text class="s" x="56" y="918">that turns on the safety net. Also pins the exact version of the engine or tool, so everyone runs the same one.</text>
</svg>
