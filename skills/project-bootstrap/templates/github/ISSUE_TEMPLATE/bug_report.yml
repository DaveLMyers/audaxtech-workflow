name: Bug report
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
{{AREA_OPTIONS}}
    validations:
      required: false
